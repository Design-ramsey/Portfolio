<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        /* --- DYNAMIC THEME VARIABLES --- */
        :root {
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: rgb(129, 127, 250);
        }

        /* High-contrast dark text for bright backgrounds */
        body[data-theme="light"] {
            --text-color: rgb(15, 0, 70);
            --accent-color: rgb(129, 127, 250);
            --btn-bg: rgb(15, 0, 70);
            --btn-text: #ffffff;
            --btn-hover: rgb(65, 62, 201);
        }

        /* High-contrast white text for dark backgrounds */
        body[data-theme="dark"] {
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #eeeeee;
        }

        * {
            margin: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', Lora, sans-serif;
            scrollbar-width: none;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: grey;
            animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: color 0.5s ease;
            color: var(--text-color);
        }

        .slide-out-up {
            animation: slideOutUp 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes slideInUp {
            from { transform: translateY(100vh); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideOutUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100vh); opacity: 0; }
        }

        /* Apply variables to links and text elements */
        a, h3, .socials {
            color: var(--text-color);
            text-decoration: none;
            position: relative;
            transition: color 0.5s ease;
        }

        a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease-in-out, background-color 0.5s ease;
        }

        a:hover::after {
            width: 100%;
        }

        h1 {
            font-weight: 1000;
            font-size: 5em;
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            margin: 0;
            width: 100%;
            color: var(--text-color);
            transition: color 0.5s ease;
        }

        h1 span {
            display: inline-block;
            opacity: 0;
            white-space: pre; 
        }

        .animate-h1-trigger span {
            animation: assembleHarmoniously 2s forwards;
        }

        @keyframes assembleHarmoniously {
            0% { 
                opacity: 0; 
                transform: translateY(60px) scale(0.5); 
                letter-spacing: 20px; 
                filter: blur(10px); 
            }
            30% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
                letter-spacing: normal; 
                filter: blur(0px); 
            }
            70% { 
                opacity: 1; 
                transform: translateY(0); 
                filter: blur(0px); 
            }
            100% { 
                opacity: 0; 
                transform: scale(1.5); 
                filter: blur(10px); 
            }
        }

        .navigation {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 5rem;
            padding: 0 5rem;
            width: 100%;
            z-index: 100;
            position: absolute;
            top: 0;
            background: transparent;
        }

        .list {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            list-style-type: none;
            font-size: 1em;
            font-weight: 500;
        }
        
        .socials {
            font-size: 0.75em;
            display: inline-flex;
            flex-direction: row;
            list-style: none;
            gap: 1rem;
        }

        .container {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            position: relative;
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
        }

        .section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            position: relative;
            transition: background-color 0.8s ease; 
        }

        .content {
            width: 100%;
            height: 100%;
            background-color: transparent;
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85); 
            opacity: 0.3; 
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }

        .section.visible .content {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1); 
        }

        .content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); /* Added shadow for image depth against backgrounds */
        }

        /* The shimmering gradient remains isolated and perfectly visible */
        .catalog {
            background: linear-gradient(90deg, #ff8a00, #e52e71, #ff8a00);
            background-size: 200% auto;
            color: transparent !important; /* Force transparent for clip text */
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        .catalog::after { display: none; } /* Remove underline from catalog to keep it clean */

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: absolute;
            padding: 1rem 5rem;
            right: 0;
            bottom: 0;
            z-index: 100;
            pointer-events: none;
             
        }

        .footer > * {
            pointer-events: auto; 
        }

        .footer_list {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 2rem;
            list-style: none;
            font-size: 1em;
            font-weight: 400;
        }

        .work_button {
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border-radius: 25px;
            padding: 10px;
            width: 150px;
            border: transparent 1px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.5s ease, color 0.5s ease;
            font-weight: bold;
        }

        .work_button:hover {
            transform: scale(1.1);
            background-color: var(--btn-hover);
            color: #ffffff;
        }

        .contact_info {
            width: 100%;
            height: 5rem;
            background-color: rgba(0, 0, 0, 0.85);
            position: absolute;
            top: 5rem;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        body:has(.list_portfolio:hover) .contact_info {
            opacity: 1;
            visibility: visible;
        }

        .object_1 { background-color: rgb(138, 138, 138); }
        .object_2 { background-color: rgb(196, 196, 196); }
        .object_3 { background-color: rgb(184, 184, 184); }

    </style>
</head>
<body data-theme="dark">
    <div class="navigation">
        <div>
            <h3 id="nav-work-number">WORK_NO:1</h3>
        </div>
        <nav>
            <ul class="list">
                <li><a href="index.html" class="transition-link">Home</a></li>
                <li><a href="portfolio.html" class="transition-link">Portfolio</a></li>
                <li><a href="#about">About Designer</a></li>
            </ul>
        </nav>
        <div>
            <ul class="socials">
                <li><a href="#linkedin">LinkedIn</a></li>
                <li><a href="#behance">Behance</a></li>
                <li><a href="#mail">Mail</a></li>
            </ul>
        </div>
    </div>

    <main class="container">
        <section class="section object_1">
            <h1>WORK_NO:1</h1>
            <div class="content">
                <img src="images/wandertech_band.jpeg" alt="Work 1">
            </div>
        </section>

        <section class="section object_2">
            <h1>WORK_NO:2</h1>
            <div class="content">
                <img src="images/business_card_pack_f&b_2.jpg" alt="Work 2">
            </div>
        </section>

        <section class="section object_3">
            <h1>WORK_NO:3</h1>
            <div class="content">
                <img src="images/imggg_3.webp" alt="Work 3">
            </div>
        </section>

        <section class="section object_3">
            <h1>WORK_NO:4</h1>
            <div class="content">
                <img src="images/Poster_on_Concrete_Background_Mockup_3.png" alt="Work 4">
            </div>
        </section>

        <section class="section object_3">
            <h1>WORK_NO:5</h1>
            <div class="content">
                <img src="images/Poster_on_Concrete_Background_Mockup_2 copy.webp" alt="Work 4">
            </div>
        </section>
    </main>

    <div class="footer">
        <div>
            <button class="work_button">Hire My Skills</button>
        </div>
        <div>
            <ul class="footer_list">
                <li><a href="selected_works.html" class="transition-link">Selected Works</a></li>
                <li><a class="catalog" href="catalog.html">Catalog</a></li>
                <li><a href="#overview" class="list_portfolio">Get In Touch</a></li>
            </ul>
        </div>
        <div class="copy_right">
            <p style="font-size: 0.8rem;">&copy; 2026 Ramsey Asiedu</p>
        </div>
    </div>

    <div class="contact_info"></div>

    <script>
        // Page reload override
        const navType = performance.getEntriesByType("navigation")[0]?.type;
        if (navType === "reload") {
            document.body.style.animation = "none";
        }

        /* --- Split H1 Characters for Animation --- */
        document.querySelectorAll('.section h1').forEach(h1 => {
            const text = h1.textContent;
            h1.innerHTML = text.split('').map((char, i) => {
                return `<span style="animation-delay: ${i * 0.05}s">${char}</span>`;
            }).join('');
        });

        /* --- Extract Dominant Color & Calculate Luminance Contrast --- */
        function setDominantBackground(img, section) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = 1;
            canvas.height = 1;
            try {
                ctx.drawImage(img, 0, 0, 1, 1);
                const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                
                // Set the background color
                section.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                
                // Calculate perceived brightness (Luminance) formula
                const luminance = Math.round(((parseInt(r) * 299) + (parseInt(g) * 587) + (parseInt(b) * 114)) / 1000);
                
                // If luminance is high (> 125), background is light, we need a dark theme. Otherwise light.
                const contrastTheme = luminance > 125 ? 'light' : 'dark';
                section.dataset.theme = contrastTheme;

                // Immediately update body if this section is currently visible
                if (section.classList.contains('visible')) {
                    document.body.setAttribute('data-theme', contrastTheme);
                }

            } catch (e) {
                console.warn('Cross-origin canvas error. Ensure images are hosted on the same domain.');
            }
        }

        document.querySelectorAll('.section').forEach(sec => {
            const img = sec.querySelector('.content img');
            if (img) {
                img.crossOrigin = "Anonymous"; 
                if (img.complete) {
                    setDominantBackground(img, sec);
                } else {
                    img.addEventListener('load', () => setDominantBackground(img, sec));
                }
            }
        });

        /* --- Intersection Observer --- */
        const workNoHeader = document.getElementById('nav-work-number');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const h1 = entry.target.querySelector('h1');
                
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    
                    // Apply the computed contrasting theme to the entire body
                    const currentTheme = entry.target.dataset.theme || 'dark';
                    document.body.setAttribute('data-theme', currentTheme);
                    
                    if (h1) {
                        workNoHeader.textContent = h1.textContent;
                        h1.classList.remove('animate-h1-trigger');
                        void h1.offsetWidth; 
                        h1.classList.add('animate-h1-trigger');
                    }
                } else {
                    entry.target.classList.remove('visible');
                    if (h1) h1.classList.remove('animate-h1-trigger');
                }
            });
        }, { threshold: 0.5 }); 

        document.querySelectorAll('.section').forEach(element => {
            observer.observe(element);
        });

        // Transitions
        document.querySelectorAll('.transition-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault(); 
                const targetUrl = this.href;
                document.body.classList.add('slide-out-up');
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500); 
            });
        });
    </script>
</body>
</html>
